name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancels an in-progress run for the same branch/PR when a newer commit lands,
# so pushing twice in quick succession doesn't burn CI minutes finishing a
# run whose result is already stale.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default: this workflow only reads the repo and runs tests/builds -
# it never pushes commits, comments on PRs, or touches releases, so the GITHUB_TOKEN
# it's handed doesn't need anything beyond read access to repo contents.
permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (Gradle)
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit SHA rather than a mutable version tag (each
      # comment records the tag it corresponds to) - a tag like @v7 can be repointed
      # by the action's maintainer or a compromised account, and the workflow would
      # silently pull whatever it now points to on the very next run. A pinned SHA
      # can't be moved. This is the same attack shape as the real tj-actions/changed-
      # files supply-chain compromise (Mar 2025).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Generate SBOM
        run: ./gradlew cyclonedxBom --no-daemon

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom
          path: build/reports/cyclonedx/bom.json
          retention-days: 90

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-reports
          path: "**/build/reports/tests/test/"
          retention-days: 14

  frontend:
    name: Frontend build (Vite/TS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webui/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webui/frontend/package-lock.json

      - run: npm ci
      - run: npm run test
      - run: npm run build
