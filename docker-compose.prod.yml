# Production override - layer on top of the base file:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Only Caddy is meant to be internet-facing, terminating TLS and reverse-
# proxying to webui over the internal app_net - see Caddyfile. central-
# server's 8080 port in the base file is dev convenience (direct API/swagger
# access) - dropped here per that service's own comment. webui's
# ApiProxyController already forwards every /api/v1/**, /scim/v2/**, and
# /swagger-ui.html route a real browser needs, so nothing is lost by not
# publishing it directly either.
services:
  central-server:
    ports: !override []
    # central-server's own browser/MCP-client-reachable address (see application.yml's
    # bloodhound.mcp.issuer-uri) - left at the http://localhost:8080 default in prod, this gets
    # embedded as the `iss` claim in every MCP OAuth token and in the OAuth discovery documents,
    # which no real external MCP client could ever use. Must match the scoped Caddy site above.
    environment:
      MCP_ISSUER_URI: https://mcp.bloodhound-asm.com

  webui:
    ports: !override []

  # These join gluetun's network namespace entirely (see gluetun's own
  # comment below) instead of their normal networks, so their outbound
  # traffic egresses through Mullvad. localhost replaces the Docker-DNS
  # hostnames worker used to reach zap/screenshotter, since a container on
  # network_mode: service:X has no DNS name of its own on the shared
  # networks - only gluetun's does.
  #
  # worker-1/2/3 (not a single `worker` with deploy.replicas: 3 any more, see the base file's
  # own comment on that service): each already binds a distinct SERVER_PORT in the base file
  # specifically so all three can share this one namespace without colliding on the actuator
  # health port - that's the only thing that previously forced replicas down to 1 here.
  #
  # cap_add: NET_ADMIN - a real gap found live 2026-10-30: sharing gluetun's network NAMESPACE
  # does not share its CAPABILITIES. Confirmed concretely: with this missing, TCP connections to
  # *anything* on the shared subnets failed outright ("Network is unreachable", instant, not a
  # timeout) even to the bridge gateway itself, while ICMP and `ip route get` both succeeded fine
  # - the multi-table policy routing gluetun's entrypoint sets up (`ip rule`, see its own
  # comment) apparently needs the connecting process to hold NET_ADMIN to actually use those
  # non-default tables for a new TCP socket, not just to configure them. Without this, the whole
  # shared-namespace design is silently broken for exactly the kind of traffic it exists to carry.
  worker-1: &worker-vpn-override
    networks: !override []
    network_mode: "service:gluetun"
    cap_add:
      - NET_ADMIN
    depends_on:
      gluetun:
        condition: service_started
    environment:
      ZAP_BASE_URL: http://localhost:8080
      SCREENSHOTTER_BASE_URL: http://localhost:3000

  worker-2:
    <<: *worker-vpn-override

  worker-3:
    <<: *worker-vpn-override

  zap:
    networks: !override []
    network_mode: "service:gluetun"
    cap_add:
      - NET_ADMIN
    depends_on:
      gluetun:
        condition: service_started

  screenshotter:
    networks: !override []
    network_mode: "service:gluetun"
    cap_add:
      - NET_ADMIN
    depends_on:
      gluetun:
        condition: service_started

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      webui:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app_net
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # VPN egress for the scanning containers (worker, zap, screenshotter) - see
  # the worker/zap/screenshotter network_mode overrides below, which join
  # this container's network namespace instead of their own. gluetun's
  # built-in firewall fails closed: if the WireGuard tunnel drops, its
  # companions lose connectivity entirely rather than falling back to the
  # host's direct route - the "always enabled" behaviour that was asked for,
  # not just "on by default." Deliberately NOT a host-wide VPN: SSH and
  # Caddy/webui stay on the server's normal connection so management access
  # and the public site are unaffected either way.
  gluetun:
    image: qmcgaw/gluetun:latest
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    restart: unless-stopped
    environment:
      VPN_SERVICE_PROVIDER: mullvad
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY: ${MULLVAD_WIREGUARD_PRIVATE_KEY}
      WIREGUARD_ADDRESSES: ${MULLVAD_WIREGUARD_ADDRESSES}
      SERVER_COUNTRIES: Sweden
    # gluetun's own DNS_SERVER (on by default in the image - deliberately left on, see this
    # service's own comment above on fail-closed VPN DNS leak protection for real target
    # lookups) replaces name resolution for the whole shared network namespace it gives worker/
    # zap/screenshotter - it has no idea what "central-server" is, a local Compose service name,
    # not a real internet host. Confirmed live 2026-10-30: worker could resolve and reach
    # central-server right after the stack first came up, then lost that ability outright after
    # a plain gluetun restart (no recreation, identical env/image) - genuinely non-deterministic
    # across restarts, not a one-off. /etc/hosts entries are checked by the system resolver
    # before any nameserver query is attempted at all, regardless of gluetun's own DNS-server
    # override, so this is reliable where depending on resolution timing isn't. Points at
    # central-server's own pinned static IP (see docker-compose.yml's app_net/central-server
    # comments) - needs to stay in sync if that ever changes.
    extra_hosts:
      - "central-server:172.20.0.10"
    # app_net gets an explicit pin here too (.5, distinct from central-server's .10) - gluetun
    # has no dependency ordering forcing it to start after central-server, so without an
    # explicit address it can simply win the race for whatever IP IPAM hands out first on a
    # fresh network (confirmed live: it grabbed central-server's own .2 pin before central-
    # server's request was honored, when neither address was explicit). Pinning both removes
    # the race entirely rather than relying on allocation order.
    networks:
      app_net:
        ipv4_address: 172.20.0.5
      scan_net:
      screenshot_net:
      targets_net:
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

volumes:
  caddy_data:
  caddy_config:
