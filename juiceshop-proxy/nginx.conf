# Fronts the juice-shop container on standard port 80, under the network
# alias "juiceshop.local" (see docker-compose.yml). Every Tier 1/Tier 2 scan
# module in this codebase assumes a target is reachable on 80/443 like a
# normal domain - this sidecar means Juice Shop (which itself only listens on
# 3000) can be scanned by all of them with zero changes to that assumption,
# rather than teaching every module about non-standard ports for one practice
# target.
server {
    listen 80;
    server_name juiceshop.local;

    location / {
        proxy_pass http://juice-shop:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Deliberate positive fixture for EXPOSURE_DIRECTORY_LISTING (see
    # ExposedPathDecisionLogic) - a distinctively-named, obviously-test-only path so this
    # never collides with anything a real site would serve, backed by real static files
    # (test-listing/) so nginx's autoindex output here is genuine, not simulated - the
    # decision logic's markers were built by capturing this response live, not guessed.
    location /bh-test-listing/ {
        alias /usr/share/nginx/bh-test-listing/;
        autoindex on;
    }
}
