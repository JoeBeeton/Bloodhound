<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bloodhound — Attack Surface Monitoring</title>
    <!-- Favicon: cropped/background-removed from the real mascot artwork (see
         BloodhoundMascot.tsx) rather than hand-coded SVG. Multi-res .ico
         (16/32/48px) in public/, served as a plain same-origin static file so
         it fits the existing `img-src 'self'` CSP with no change needed there. -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <!-- Fonts are self-hosted via @fontsource (see main.tsx) rather than loaded
         from Google's CDN: SecurityHeadersFilter's CSP is deliberately
         same-origin-only (style-src/font-src 'self') and, until this fix,
         silently blocked this exact CDN link - every browser had been
         falling back to system fonts, unnoticed, since the CSP shipped.
         Self-hosting was chosen over relaxing the CSP to trust a third-party
         host: it keeps the "no external hosts anywhere" policy genuinely
         true, and stops every visitor's IP being sent to Google on load. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
