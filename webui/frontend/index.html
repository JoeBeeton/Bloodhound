<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bloodhound — Attack Surface Monitoring</title>
    <!-- Favicon: cropped/background-removed from the real mascot artwork (see
         BloodhoundMascot.tsx) rather than hand-coded SVG. Multi-res .ico
         (16/32/48px) in public/, served as a plain same-origin static file so
         it fits the existing `img-src 'self'` CSP with no change needed there. -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <!-- Google Fonts: purely additive — safe monospace/sans fallback stacks
         are configured in tailwind.config.js if this is unreachable. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Orbitron:wght@600;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
